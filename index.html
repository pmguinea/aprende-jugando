  .b-sun{ background:var(--sun); --sh:var(--sun-d); color:#4A3200; }

  /* ---- Tipografías escolares ----
     Declaradas DESPUÉS de .btn3d para que ganen en la cascada también dentro de los botones.
     .ligada  → letra enlazada del modelo español (Playwrite España)

  .imprenta, button.imprenta{ font-family:'Andika','Fredoka',sans-serif; font-weight:700; }
  .guia{ font-family:'Playwrite ES Guides','Playwrite ES',cursive; font-weight:400; }
  .letra-xl{ font-size:clamp(44px,13vw,68px); line-height:1.5; }
  #trace-canvas{ touch-action:none; }

  .card{ background:#fff; border-radius:28px; box-shadow:0 10px 0 rgba(32,49,74,.08), 0 18px 34px rgba(32,49,74,.12); }

  /* ---- Feedback ---- */
  @keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.12)} 100%{transform:scale(1)} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }

<script>
/* =========================================================================
   APRENDE JUGANDO — app educativa para 4 y 6 años
   Estructura: Store · Audio · FX · UI · Juegos · PWA
   ========================================================================= */

/* ------------------------------ 1. ESTADO ------------------------------
   Dos jugadores independientes: cada niño tiene sus monedas, sus aciertos,
   su tiempo, sus niveles y su cofre. Entrar en un modo activa su perfil.   */
const KEY  = 'aprende-jugando-v3';
const OLD2 = 'aprende-jugando-v2';
const OLD1 = 'aprende-jugando-v1';

/* Categorías por rango de edad, no por edad exacta: se solapan en los 5 años. */
const CATS = {
  c35: { id:'c35', label:'3-5 años', emoji:'🍎', desc:'Contar, conocer letras y trazarlas' },
  c57: { id:'c57', label:'5-7 años', emoji:'🔢', desc:'Tabla del 100, sumas, duelo y palabras' }
};
const AVATARS = ['🦊','🐼','🐸','🦄','🐯','🐵','🐧','🦁','🐨','🐙'];

const newPlayer = (name, cat, avatar) => ({
  id: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  name, cat, avatar: avatar || pick(AVATARS),
  created: Date.now(),
  coins: 0, correct: 0, attempts: 0, seconds: 0,
  level4: 1, streak4: 0,                       // conteo
  letras: { level:1, dominadas:[] },
  tipo: 'ligada', traceIndex: 0,
  level6: { sumas:1, vecinos:1, palabras:1 },
  vecinosHits: 0,
  hitsSincePrize: 0,                           // aciertos hacia el próximo cofre
  duelRecord: 0,
  trophies: [],
  lastPlayed: null
});

const Store = {
  all: { active:null, players:[] },
  ghost: null,                                 // perfil vacío si todavía no hay jugador

  /** Jugador activo. El resto del código sigue usando Store.s sin enterarse. */
  get s(){
    return this.all.players.find(p => p.id === this.all.active) || this.ghost;
  },
  get hasPlayer(){ return this.all.players.some(p => p.id === this.all.active); },
  get cat(){ return CATS[this.s.cat] || CATS.c35; },

  playersIn(cat){ return this.all.players.filter(p => p.cat === cat); },
  byId(id){ return this.all.players.find(p => p.id === id); },

  load(){
    this.ghost = newPlayer('—', 'c35', '🙂');
    this.all = { active:null, players:[] };
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const d = JSON.parse(raw) || {};
        this.all.players = Array.isArray(d.players) ? d.players : [];
        this.all.active  = d.active || null;
      }else{
        this.migrar();
      }
    }catch(e){ this.all = { active:null, players:[] }; }
    this.all.players.forEach(p => this.normalize(p));
    if(!this.hasPlayer) this.all.active = this.all.players.length ? this.all.players[0].id : null;
  },

  /** Recupera las partidas de versiones anteriores como jugadores con nombre. */
  migrar(){
    try{
      const v2 = JSON.parse(localStorage.getItem(OLD2) || 'null');
      if(v2){
        if(v2.p4 && (v2.p4.correct || v2.p4.coins)) this.all.players.push(Object.assign(newPlayer('Peque','c35','🦊'), v2.p4, { cat:'c35' }));
        if(v2.p6 && (v2.p6.correct || v2.p6.coins)) this.all.players.push(Object.assign(newPlayer('Mayor','c57','🐼'), v2.p6, { cat:'c57' }));
        return;
      }
      const v1 = JSON.parse(localStorage.getItem(OLD1) || 'null');
      if(v1 && (v1.correct || v1.coins)) this.all.players.push(Object.assign(newPlayer('Peque','c35','🦊'), v1, { cat:'c35' }));
    }catch(e){}
  },

  /** Rellena campos que puedan faltar en datos guardados antiguos. */
  normalize(p){
    if(!p.id) p.id = 'j' + Math.random().toString(36).slice(2, 10);
    if(!p.name) p.name = 'Jugador';
    if(!CATS[p.cat]) p.cat = 'c35';
    if(!p.avatar) p.avatar = pick(AVATARS);
    if(!p.letras || typeof p.letras !== 'object') p.letras = { level:1, dominadas:[] };
    if(!Array.isArray(p.letras.dominadas)) p.letras.dominadas = [];
    if(!p.letras.level) p.letras.level = 1;
    if(!p.level6) p.level6 = { sumas:1, vecinos:1, palabras:1 };
    if(!Array.isArray(p.trophies)) p.trophies = [];
    ['coins','correct','attempts','seconds','level4','streak4','vecinosHits','hitsSincePrize','duelRecord','traceIndex']
      .forEach(k => { if(typeof p[k] !== 'number') p[k] = (k === 'level4' ? 1 : 0); });
  },

  save(){
    try{ localStorage.setItem(KEY, JSON.stringify(this.all)); }catch(e){}
  },

  use(id){
    this.all.active = id;
    this.save();
    UI.paintCoins();
  },

  add(name, cat, avatar){
    const p = newPlayer(name.trim().slice(0, 14) || 'Jugador', cat, avatar);
    this.all.players.push(p);
    this.all.active = p.id;
    this.save();
    UI.paintCoins();
    return p;
  },

  rename(id, name){
    const p = this.byId(id);
    if(p){ p.name = name.trim().slice(0, 14) || p.name; this.save(); }
  },

  /** Pone a cero la puntuación pero conserva al jugador. */
  resetPlayer(id){
    const p = this.byId(id);
    if(!p) return;
    const limpio = newPlayer(p.name, p.cat, p.avatar);
    limpio.id = p.id; limpio.created = p.created;
    this.all.players[this.all.players.indexOf(p)] = limpio;
    this.save();
    UI.paintCoins();
  },

  /** Lo borra del histórico. */
  removePlayer(id){
    this.all.players = this.all.players.filter(p => p.id !== id);
    if(!this.hasPlayer) this.all.active = this.all.players.length ? this.all.players[0].id : null;
    this.save();
    UI.paintCoins();
  },

  addCoins(n){ this.s.coins += n; UI.paintCoins(); this.save(); },

  score(ok){
    this.s.attempts++;
    if(ok){
      this.s.correct++;
      this.s.coins++;
      this.s.hitsSincePrize++;
      UI.paintCoins();
    }
    this.s.lastPlayed = Date.now();
    this.save();
  },

  accuracy(){
    return this.s.attempts ? Math.round(this.s.correct / this.s.attempts * 100) : 0;
  }
};

/* Contador de tiempo de juego (solo con la pestaña visible) */
setInterval(() => {
  if(document.visibilityState === 'visible' && Game.current){
    Store.s.seconds++;
    if(Store.s.seconds % 10 === 0) Store.save();
  }
}, 1000);
window.addEventListener('pagehide', () => Store.save());

/* ------------------------------ 2. SONIDO ------------------------------ */
const Audio_ = {
  ctx: null,
  on: true,
  init(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) this.ctx = new AC();
    }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, start, dur, type = 'sine', vol = .22){
    if(!this.on || !this.ctx) return;
    const t0 = this.ctx.currentTime + start;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  tap(){ this.tone(520, 0, .08, 'triangle', .14); },
  good(){ [[659,0],[784,.09],[1047,.18]].forEach(([f,t]) => this.tone(f, t, .18, 'triangle')); },
  bad(){ this.tone(210, 0, .18, 'sawtooth', .12); this.tone(150, .1, .22, 'sawtooth', .12); },
  coin(){ this.tone(988, 0, .07, 'square', .12); this.tone(1319, .07, .12, 'square', .12); },
  level(){ [523,659,784,1047,1319].forEach((f,i) => this.tone(f, i * .1, .25, 'triangle', .2)); },
  tick(){ this.tone(880, 0, .05, 'square', .08); }
};
document.addEventListener('pointerdown', () => Audio_.init(), { once:true });

/** Lee un texto en voz alta (los de 4 años todavía no leen la consigna). */
function say(text){
  if(!Audio_.on || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = .85; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ------------------------------ 3. EFECTOS ----------------------------- */
const FX = {
  burst(){
    if(typeof confetti !== 'function') return;
    confetti({ particleCount: 70, spread: 72, origin:{ y:.7 }, scalar:1.1,
      colors:['#FFB703','#2EC4B6','#FF5D73','#8367F0','#2A9DF4'] });
  },
  party(){
    if(typeof confetti !== 'function') return;
    const end = Date.now() + 1200;
    (function frame(){
      confetti({ particleCount:5, angle:60, spread:60, origin:{x:0, y:.8} });
      confetti({ particleCount:5, angle:120, spread:60, origin:{x:1, y:.8} });
      if(Date.now() < end) requestAnimationFrame(frame);
    })();
  }
};

/* ------------------------------ 4. UTILES ------------------------------ */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(v => v[1]);

/** Devuelve `n` opciones barajadas que incluyen la respuesta. */
function options(answer, n, min, max){
  const set = new Set([answer]);
  let guard = 0;
  while(set.size < n && guard++ < 200){
    const d = rnd(1, Math.max(2, Math.round((max - min) / 3)));
    const v = Math.random() < .5 ? answer - d : answer + d;
    if(v >= min && v <= max) set.add(v);
  }
  while(set.size < n) set.add(rnd(min, max));
  return shuffle([...set]);
}

/** Los nombres los escribe el usuario: hay que escaparlos antes de inyectarlos. */
function esc(t){
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(sec){
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h} h ${m} min` : (m ? `${m} min ${s} s` : `${s} s`);
}

/* ------------------------------ 5. TROFEOS ----------------------------- */
const TROPHIES = [
  { id:'unicornio', emoji:'🦄', name:'Unicornio',  cost:15 },
  { id:'cohete',    emoji:'🚀', name:'Cohete',     cost:30 },
  { id:'dino',      emoji:'🦖', name:'Dinosaurio', cost:50 },
  { id:'dragon',    emoji:'🐉', name:'Dragón',     cost:75 },
  { id:'castillo',  emoji:'🏰', name:'Castillo',   cost:110 },
  { id:'corona',    emoji:'👑', name:'Corona',     cost:150 },
  { id:'ballena',   emoji:'🐳', name:'Ballena',    cost:200 },
  { id:'arcoiris',  emoji:'🌈', name:'Arcoíris',   cost:260 }
];

/* ------------------------------ 6. INTERFAZ ---------------------------- */
const app = document.getElementById('app');

const UI = {
  paintCoins(){
    document.getElementById('coin-count').textContent = Store.s.coins;
    document.getElementById('who-emoji').textContent = Store.hasPlayer ? Store.s.avatar : '👤';
  },

  title(t){ document.getElementById('screen-title').textContent = t; },

  render(html, titleText){
    app.innerHTML = html;
    app.firstElementChild && app.firstElementChild.classList.add('enter');
    if(titleText) this.title(titleText);
    window.scrollTo(0, 0);
  },

  openSheet(html){
    document.getElementById('sheet').innerHTML = html;
    document.getElementById('overlay').classList.remove('hidden');
  },
  closeSheet(){ document.getElementById('overlay').classList.add('hidden'); },

  levelUp(n, text){

function unlock(id){
  const t = TROPHIES.find(x => x.id === id);
  if(!t || Store.s.coins < t.cost || Store.s.trophies.includes(id)) return;
  Store.s.coins -= t.cost;
  Store.s.trophies.push(id);
  Store.save(); UI.paintCoins(); Audio_.level(); FX.party();
  panelChest();
}

/* --------------------------- 8. MOTOR DE JUEGO ------------------------- */
const Game = {
  current: null,        // función que genera la siguiente pregunta
  lock: false,

  start(fn, title){
    this.current = fn;
    UI.title(title);
    this.next();
  },
  next(){
    this.lock = false;
    if(this.current) this.current();
  },
  stop(){ this.current = null; },

  /** Respuesta del niño: pinta feedback, puntúa y encadena. */
  answer(btn, ok, afterCorrect, delayOk = 850){
    if(this.lock) return;
    this.lock = true;
    Store.score(ok);

    if(ok){
      btn.classList.add('ok');
      Audio_.good(); Audio_.coin(); FX.burst();
      setTimeout(() => { if(afterCorrect) afterCorrect(); else continuar(); }, delayOk);
    }else{
      btn.classList.add('no');
      Audio_.bad();
      setTimeout(() => { btn.classList.remove('no'); this.lock = false; }, 450);
    }
  }
};

/* Premio cada 10 aciertos, en cualquier juego y en las dos categorías. */
const PREMIO_CADA = 10;

/** Vuelve al menú de la categoría del jugador activo. */
function volverCategoria(){ Store.s.cat === 'c57' ? Mode57() : Mode35(); }

/** Continúa la partida, parando antes si toca cofre. */
function continuar(){
  if(Store.s.hitsSincePrize >= PREMIO_CADA) pantallaPremio();
  else Game.next();
}

/** Pantalla de premio: un cofre del baúl y monedas extra. */
function pantallaPremio(){
  Store.s.hitsSincePrize = 0;
  const pendientes = TROPHIES.filter(t => !Store.s.trophies.includes(t.id));
  let emoji, texto;

  if(pendientes.length){
    const t = pendientes[0];
    Store.s.trophies.push(t.id);
    Store.addCoins(10);
    emoji = t.emoji;
    texto = `${t.name} para el cofre de ${esc(Store.s.name)}, y 10 monedas más.`;
  }else{
    Store.addCoins(25);
    emoji = '🪙';
    texto = 'Ya tiene el cofre completo, así que van 25 monedas.';
  }
  Store.save();
  Audio_.level(); FX.party();
  say('¡Premio!');

  UI.render(`<section class="card p-6 text-center">
    <div class="text-7xl bob">${emoji}</div>
    <h2 class="text-3xl font-bold mt-3">¡${PREMIO_CADA} aciertos!</h2>
    <p class="font-body text-[#5A6B86] mt-2">${texto}</p>
    <button class="btn3d b-mint w-full mt-5 py-5 text-xl" onclick="Game.next()">Seguir jugando</button>
    <button class="btn3d b-white w-full mt-2 py-4" onclick="volverCategoria()">Elegir otro juego</button>
  </section>`);
}

/** Lanza el diálogo nativo si el navegador lo permite. */
async function lanzarInstalacion(){
  Audio_.tap();
  ocultarInstalar();

  if(promptInstalacion){
    promptInstalacion.prompt();
    try{
      const { outcome } = await promptInstalacion.userChoice;
      if(outcome !== 'accepted') posponerInstalacion(7);
    }catch(e){}
    promptInstalacion = null;
    pantallaInstalacion();                  // refresca el estado de la pantalla
    return;
  }

  if(esIOS()) return instruccionesIOS();

  UI.openSheet(`
    <h2 class="text-2xl font-bold">Todavía no se puede</h2>
    <p class="font-body text-[#5A6B86] mt-2 leading-relaxed">
      Chrome solo ofrece instalar cuando ve que la web se usa de verdad. Juega un rato,
      vuelve a esta pantalla y el botón funcionará. Mientras tanto puedes hacerlo a mano
      desde los ⋮ tres puntos del navegador.
    </p>
    <button class="btn3d b-mint w-full mt-5 py-4 text-lg" onclick="UI.closeSheet()">Entendido</button>`);
}

const LEVELS4 = [

function grid(items){
  return `<div class="flex flex-wrap justify-center gap-x-2 gap-y-1 max-w-sm mx-auto">
    ${items.map(f => `<span class="fruit">${f}</span>`).join('')}</div>`;
}

function round4(){
  const cfg = lv4();
  const mode = pick(cfg.modes);
  const header = UI.scorebar(
    `Nivel ${Store.s.level4} · faltan ${PREMIO_CADA - Store.s.hitsSincePrize} para el cofre 🎁`,
    `✅ ${Store.s.correct}`
  );

  if(mode === 'comparar'){
    const fa = pick(FRUITS); let fb = pick(FRUITS.filter(f => f !== fa));
    let a = rnd(2, cfg.max), b = rnd(2, cfg.max);
    while(a === b) b = rnd(2, cfg.max);
    const more = Math.random() < .5;
    const win = more ? (a > b ? 'A' : 'B') : (a < b ? 'A' : 'B');

    UI.render(`<section>${header}
      <div class="card p-4 text-center">
        <h2 class="text-2xl font-bold mb-3">¿Dónde hay ${more ? 'más' : 'menos'}?</h2>
        <div class="grid grid-cols-2 gap-2">
          <button class="btn3d b-white p-3" data-k="A">${grid(Array(a).fill(fa))}</button>
          <button class="btn3d b-white p-3" data-k="B">${grid(Array(b).fill(fb))}</button>
        </div>
      </div></section>`);

    app.querySelectorAll('[data-k]').forEach(btn => {
      btn.onclick = () => Game.answer(btn, btn.dataset.k === win, scored4);
    });
    return;
  }

  // contar / mezcla
  let items, answer, question;
  if(mode === 'mezcla'){
    const target = pick(FRUITS);
    const other = pick(FRUITS.filter(f => f !== target));
    answer = rnd(2, cfg.max);
    const noise = rnd(2, Math.max(3, Math.round(cfg.max / 2)));
    items = shuffle([...Array(answer).fill(target), ...Array(noise).fill(other)]);
    question = `¿Cuántos <span class="text-3xl align-middle">${target}</span> hay?`;
  }else{
    const f = pick(FRUITS);
    answer = rnd(1, cfg.max);
    items = Array(answer).fill(f);
    question = '¿Cuántas frutas hay?';
  }

  const opts = options(answer, cfg.opts, 1, Math.max(cfg.max, answer + 2));

  UI.render(`<section>${header}
    <div class="card p-4">
      <h2 class="text-2xl font-bold text-center mb-3">${question}</h2>
      <div class="bg-[#F6F9FD] rounded-2xl py-4 px-2 mb-4 min-h-[120px] flex items-center justify-center">
        ${grid(items)}
      </div>
      <div class="grid grid-cols-${Math.min(opts.length, 4)} gap-2">
        ${opts.map(o => `<button class="btn3d b-sun py-6 text-3xl" data-v="${o}">${o}</button>`).join('')}
      </div>
    </div></section>`);

  app.querySelectorAll('[data-v]').forEach(btn => {
    btn.onclick = () => Game.answer(btn, +btn.dataset.v === answer, scored4);
  });
}

/* =======================================================================
   CATEGORÍA 3-5 AÑOS — CONOCER LETRAS
   Tipografía escolar: letra ligada española (Playwrite ES) o letra de palo
   de lectoescritura (Andika, con la 'a' y la 'g' de una sola panza).
   ======================================================================= */
const VOCALES   = ['A','E','I','O','U'];
const ABC_FACIL = ['A','E','I','O','U','M','P','L','S','T','N','D'];
const ABC       = [...'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'];

const LEVELS_L = [
  { pool:VOCALES,   opts:3, modes:['escucha'] },
  { pool:ABC_FACIL, opts:3, modes:['escucha','escucha','pareja'] },
  { pool:ABC_FACIL, opts:4, modes:['escucha','pareja','inicial'] },
  { pool:ABC,       opts:4, modes:['escucha','pareja','inicial'] }
];

let lastSpoken = '';

const fontClass = () => Store.s.tipo === 'ligada' ? 'ligada' : 'imprenta';

function toggleTipo(){
  Store.s.tipo = Store.s.tipo === 'ligada' ? 'imprenta' : 'ligada';
  Store.save();
  Game.next();
}

function letterOptions(answer, n, pool){
  const set = new Set([answer]);
  const rest = pool.filter(l => l !== answer);
  let guard = 0;
  while(set.size < n && guard++ < 120) set.add(pick(rest.length ? rest : ABC));
  return shuffle([...set]);
}

/** Letras del nivel que el niño todavía no ha acertado. */
const pendientesL = () => nivelL().pool.filter(l => !Store.s.letras.dominadas.includes(l));

function dominar(letra){
  if(!Store.s.letras.dominadas.includes(letra)) Store.s.letras.dominadas.push(letra);

  }

  const opts = letterOptions(target, cfg.opts, cfg.pool);
  const hechas = cfg.pool.filter(l => Store.s.letras.dominadas.includes(l)).length;

  UI.render(`<section>
    ${UI.scorebar(`${hechas}/${cfg.pool.length} letras · faltan ${PREMIO_CADA - Store.s.hitsSincePrize} para el cofre 🎁`, `✅ ${Store.s.correct}`)}

          ${Store.s.tipo === 'ligada' ? '✏️ Letra ligada' : '🔠 Letra de palo'}
        </button>
        <button class="btn3d b-white px-3 py-2 text-sm font-body" onclick="say(lastSpoken)">🔊 Repetir</button>
      </div>

      <h2 class="text-xl font-bold">${prompt}</h2>
      <div id="letra-box" class="my-4 min-h-[130px] flex flex-col items-center justify-center">${visual}</div>

      <div class="grid grid-cols-${Math.min(opts.length, 4)} gap-2">
        ${opts.map(o => `<button class="btn3d b-mint py-5 ${f} text-4xl" data-v="${o}">${o}</button>`).join('')}
      </div>
    </div></section>`);

  say(lastSpoken);

  let fallos = 0;
  app.querySelectorAll('[data-v]').forEach(btn => {

        btn.classList.add('ok');

          say(`Esta es la ${target}`);

  });

function renderTrazo(){
  const l = traceLetter();
  const fuente = Store.s.tipo === 'ligada' ? 'guia' : 'imprenta';

  UI.render(`<section>
    ${UI.scorebar('Repasa la letra con el dedo', `🪙 ${Store.s.coins}`)}

      <div class="flex items-center gap-2 mb-3">
        <button class="btn3d b-white w-12 h-12 text-xl shrink-0" onclick="traceMove(-1)" aria-label="Letra anterior">‹</button>
        <button class="btn3d b-blue flex-1 h-12 text-base font-body" onclick="say('${l}')">🔊 Esta es la ${l}</button>
        <button class="btn3d b-white w-12 h-12 text-xl shrink-0" onclick="traceMove(1)" aria-label="Siguiente letra">›</button>
      </div>

      <div id="trace-box" class="relative rounded-2xl bg-white border-[3px] border-dashed border-[#CBD8E8] overflow-hidden" style="height:min(42vh,280px)">
        <div class="absolute inset-0 flex items-center justify-center ${fuente} select-none text-[#CBD8E8]"
             style="font-size:min(34vh,220px); line-height:1">${l}</div>
        <canvas id="trace-canvas" class="absolute inset-0 w-full h-full"></canvas>
      </div>

      <div class="grid grid-cols-3 gap-2 mt-3">
        <button class="btn3d b-white py-4 text-sm font-body" onclick="traceClear()">🧽 Borrar</button>
        <button class="btn3d b-white py-4 text-sm font-body" onclick="traceCase()">${traceUpper ? 'a minúscula' : 'A MAYÚSCULA'}</button>
        <button class="btn3d b-mint py-4 text-sm font-body" onclick="traceDone()">✅ ¡Listo!</button>
      </div>

      <button class="btn3d b-white w-full mt-2 py-3 text-sm font-body" onclick="toggleTipo()">
        ${Store.s.tipo === 'ligada' ? 'Cambiar a letra de palo' : 'Cambiar a letra ligada'}
      </button>
    </div></section>`);

  initTrace();
}

let traceCtx = null;

function initTrace(){
  const c = document.getElementById('trace-canvas');
  if(!c) return;
  const r = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * dpr);
  c.height = Math.round(r.height * dpr);

  traceCtx = c.getContext('2d');
  if(!traceCtx) return;                       // navegador sin canvas: el resto sigue funcionando
  traceCtx.scale(dpr, dpr);
  traceCtx.lineWidth = 14;
  traceCtx.lineCap = 'round';
  traceCtx.lineJoin = 'round';
  traceCtx.strokeStyle = '#8367F0';

  let drawing = false;
  const pos = e => {
    const b = c.getBoundingClientRect();
    return [e.clientX - b.left, e.clientY - b.top];
  };

  c.addEventListener('pointerdown', e => {
    drawing = true;
    c.setPointerCapture(e.pointerId);
    const [x, y] = pos(e);
    traceCtx.beginPath();
    traceCtx.moveTo(x, y);
    traceCtx.lineTo(x + 0.1, y);
    traceCtx.stroke();
    Audio_.tap();
  });
  c.addEventListener('pointermove', e => {
    if(!drawing) return;
    const [x, y] = pos(e);
    traceCtx.lineTo(x, y);
    traceCtx.stroke();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev =>
    c.addEventListener(ev, () => { drawing = false; }));
}

function traceClear(){
  const c = document.getElementById('trace-canvas');
  if(c && traceCtx) traceCtx.clearRect(0, 0, c.width, c.height);
}

/** El trazo no se corrige: se premia el intento y no cuenta en la precisión. */
function traceDone(){
  Store.addCoins(1);
  Audio_.coin(); FX.burst();
  say('¡Muy bien!');
  setTimeout(() => { traceClear(); traceMove(1); }, 800);
}

      Récord del duelo: <b class="text-[#20314A]">${Store.s.duelRecord}</b> ·
      Precisión general: <b class="text-[#20314A]">${Store.accuracy()}%</b>
    </div>
  </section>`, '5-7 años');
}

/* ----------------------- 6A. VECINOS DE LA TABLA DEL 100 --------------- */
function GameVecinos(){ track('juego-vecinos'); Game.start(roundVecinos, 'Vecinos del 100'); }

function roundVecinos(){
  // Centro válido: los vecinos de la fila no se salen de la decena y ±10 cabe en la tabla
  let centro = rnd(12, 88);
  if(centro % 10 === 0) centro += 1;
  if(centro % 10 === 9) centro -= 1;

  // Dos de cada tres rondas son solo anterior y posterior
  const soloFila = Math.random() < .66;

  const fila = [
    { k:'left',  v:centro - 1, label:'el anterior'  },
    { k:'right', v:centro + 1, label:'el siguiente' }
  ];
  const columna = [
    { k:'up',    v:centro - 10, label:'diez menos' },
    { k:'down',  v:centro + 10, label:'diez más'   }
  ];

  const q = soloFila ? pick(fila) : pick([...fila, ...columna]);
  const cell = s => s.k === q.k
    ? `<div class="cell cell-q" id="slot">?</div>`
    : `<div class="cell">${s.v}</div>`;

  const tabla = soloFila
    ? `<div class="grid grid-cols-3 gap-2 max-w-xs mx-auto">
         ${cell(fila[0])}<div class="cell cell-c">${centro}</div>${cell(fila[1])}
       </div>`
    : `<div class="grid grid-cols-3 gap-2 max-w-xs mx-auto">
         <div></div>${cell(columna[0])}<div></div>
         ${cell(fila[0])}<div class="cell cell-c">${centro}</div>${cell(fila[1])}
         <div></div>${cell(columna[1])}<div></div>
       </div>`;

  // Distractores plausibles: las confusiones típicas (±1, ±9, ±10, ±11),
  // nunca un número que ya esté a la vista en el tablero
  const visibles = (soloFila ? [...fila] : [...fila, ...columna])
    .filter(s => s.k !== q.k).map(s => s.v).concat(centro);
  const candidatos = shuffle([q.v - 1, q.v + 1, q.v - 9, q.v + 9, q.v - 10, q.v + 10, q.v - 11, q.v + 11])
    .filter(v => v > 0 && v <= 100 && v !== q.v && !visibles.includes(v));
  const opts = shuffle([q.v, ...candidatos.slice(0, 2)]);

  const faltan = PREMIO_CADA - Store.s.hitsSincePrize;

  UI.render(`<section>
    ${UI.scorebar(`Faltan ${faltan} para el cofre 🎁`, `✅ ${Store.s.correct}`)}
    <div class="card p-4">
      <h2 class="text-xl font-bold text-center mb-1">¿Qué número falta?</h2>
      <p class="font-body text-center text-sm text-[#5A6B86] mb-4">Es ${q.label} de ${centro}.</p>

      ${tabla}

      <div class="grid grid-cols-3 gap-2 mt-5">
        ${opts.map(o => `<button class="btn3d b-blue py-6 text-2xl" data-v="${o}">${o}</button>`).join('')}
      </div>
    </div></section>`);

  app.querySelectorAll('[data-v]').forEach(btn => {
    btn.onclick = () => Game.answer(btn, +btn.dataset.v === q.v, () => {
      const slot = document.getElementById('slot');
      if(slot){ slot.textContent = q.v; slot.classList.remove('cell-q'); slot.classList.add('cell-c'); }
      Store.s.vecinosHits++;
      Store.save();
      setTimeout(continuar, 500);
    });
  });
}

/* ----------------------------- 6B. SUMAS Y RESTAS ---------------------- */
function GameSumas(){ track('juego-sumas'); Game.start(roundSumas, 'Sumas y restas'); }

function roundSumas(){
  const lvl = Store.s.level6.sumas;              // 1..4
  const top = [10, 20, 50, 99][Math.min(lvl, 4) - 1];
  const isSum = Math.random() < .55;

  let a, b, res, sign;
  if(isSum){
    a = rnd(1, top); b = rnd(1, Math.max(1, top - a)); res = a + b; sign = '+';
  }else{
    a = rnd(2, top); b = rnd(1, a); res = a - b; sign = '−';
  }

  const visual = (a + b) <= 20
    ? `<div class="flex flex-wrap justify-center gap-1 mb-3">
         ${Array(a).fill('<span class="text-2xl">🔵</span>').join('')}
         ${Array(b).fill(`<span class="text-2xl">${isSum ? '🟢' : '❌'}</span>`).join('')}
       </div>` : '';

  const opts = options(res, 4, 0, res + 12);

  UI.render(`<section>
    ${UI.scorebar(`Nivel ${lvl} · hasta ${top}`, `🎯 ${Store.accuracy()}%`)}
    <div class="card p-5 text-center">
      ${visual}
      <div class="text-5xl sm:text-6xl font-bold tracking-wide my-3 tabular-nums">${a} ${sign} ${b} = ?</div>
      <div class="grid grid-cols-2 gap-2 mt-5">
        ${opts.map(o => `<button class="btn3d b-mint py-6 text-3xl" data-v="${o}">${o}</button>`).join('')}
      </div>
    </div></section>`);

  app.querySelectorAll('[data-v]').forEach(btn => {
    btn.onclick = () => Game.answer(btn, +btn.dataset.v === res, () => {
      sumasHits++;
      if(sumasHits % 10 === 0 && Store.s.level6.sumas < 4){
        Store.s.level6.sumas++;
        Store.addCoins(5);
        UI.levelUp(Store.s.level6.sumas, 'Los números ahora son más grandes.');
        return;
      }
      continuar();
    });
  });
}
let sumasHits = 0;

/* ------------------------------ 6C. DUELO PISTOLERO -------------------- */
const DUEL_TIME = 30;
let duel = null;

function GameDuelo(){
  Game.stop();
  UI.render(`<section class="card p-6 text-center">
    <div class="text-6xl bob">🤠</div>
    <h2 class="text-3xl font-bold mt-2">Duelo pistolero</h2>
    <p class="font-body text-[#5A6B86] mt-2">Tienes ${DUEL_TIME} segundos. Responde todas las que puedas antes de que el robot se adelante.</p>
    <p class="font-body text-sm text-[#5A6B86] mt-3">Tu récord: <b class="text-[#20314A]">${Store.s.duelRecord}</b></p>
    <button class="btn3d b-coral w-full mt-5 py-5 text-2xl" onclick="duelStart()">¡Empezar!</button>
    <button class="btn3d b-white w-full mt-2 py-4" onclick="Mode57()">Volver</button>
  </section>`, 'Duelo pistolero');
}

function duelStart(){
  track('juego-duelo');
  duel = { left: DUEL_TIME, hits: 0, timer: null };
  Game.current = duelRound;                       // mantiene el contador de tiempo activo
  duel.timer = setInterval(() => {
    duel.left--;
    const bar = document.getElementById('duel-bar');
    const num = document.getElementById('duel-left');
    if(bar) bar.style.width = (duel.left / DUEL_TIME * 100) + '%';
    if(num) num.textContent = duel.left;
    if(duel.left <= 5 && duel.left > 0) Audio_.tick();
    if(duel.left <= 0) duelEnd();
  }, 1000);
  duelRound();
}

function duelRound(){
  if(!duel) return;
  const a = rnd(2, 20), b = rnd(1, 9);
  const isSum = Math.random() < .5;
  const res = isSum ? a + b : Math.max(a, b) - Math.min(a, b);
  const x = isSum ? a : Math.max(a, b), y = isSum ? b : Math.min(a, b);
  const opts = options(res, 4, 0, res + 10);

  UI.render(`<section>
    <div class="flex items-center gap-2 mb-3">
      <span class="text-2xl">🤠</span>
      <div class="flex-1 h-4 rounded-full bg-[#FFE0E5] overflow-hidden">
        <div id="duel-bar" class="h-full bg-[var(--coral)] transition-[width] duration-1000 ease-linear" style="width:${duel.left / DUEL_TIME * 100}%"></div>
      </div>
      <span class="font-semibold tabular-nums w-7 text-right" id="duel-left">${duel.left}</span>
      <span class="text-2xl">🤖</span>
    </div>
    <div class="card p-5 text-center">
      <div class="font-body text-sm text-[#5A6B86]">Aciertos: <b class="text-[#20314A]">${duel.hits}</b></div>
      <div class="text-5xl sm:text-6xl font-bold my-4 tabular-nums">${x} ${isSum ? '+' : '−'} ${y}</div>
      <div class="grid grid-cols-2 gap-2">
        ${opts.map(o => `<button class="btn3d b-coral py-6 text-3xl" data-v="${o}">${o}</button>`).join('')}
      </div>
    </div></section>`);

  app.querySelectorAll('[data-v]').forEach(btn => {
    btn.onclick = () => {
      if(!duel) return;
      const ok = +btn.dataset.v === res;
      Store.score(ok);
      if(ok){
        duel.hits++;
        btn.classList.add('ok'); Audio_.good();
        setTimeout(() => { if(duel) duelRound(); }, 220);
      }else{
        btn.classList.add('no'); Audio_.bad();
        setTimeout(() => btn.classList.remove('no'), 380);
      }
    };
  });
}

function duelEnd(){
  clearInterval(duel.timer);
  const hits = duel.hits;
  duel = null;
  Game.stop();

  const record = hits > Store.s.duelRecord;
  if(record) Store.s.duelRecord = hits;
  Store.addCoins(Math.round(hits / 2));
  Store.save();
  if(record && hits > 0){ FX.party(); Audio_.level(); } else { FX.burst(); }

  UI.render(`<section class="card p-6 text-center">
    <div class="text-6xl">${hits >= 10 ? '🏆' : hits >= 5 ? '🎉' : '🤠'}</div>
    <h2 class="text-3xl font-bold mt-2">${hits} aciertos</h2>
    <p class="font-body text-[#5A6B86] mt-1">${record && hits > 0 ? '¡Nuevo récord!' : 'Récord actual: ' + Store.s.duelRecord}</p>
    <p class="font-body text-sm text-[#5A6B86] mt-2">Has ganado ${Math.round(hits / 2)} monedas extra.</p>
    <button class="btn3d b-coral w-full mt-5 py-5 text-2xl" onclick="duelStart()">Otra vez</button>
    <button class="btn3d b-white w-full mt-2 py-4" onclick="Mode57()">Elegir otro juego</button>
  </section>`);
}

/* ----------------------------- 6D. FORMAR PALABRAS --------------------- */
const WORDS = [
  ['SOL','☀️',1],['PAN','🍞',1],['PEZ','🐟',1],['OSO','🐻',1],['MAR','🌊',1],
  ['LUNA','🌙',1],['CASA','🏠',1],['GATO','🐱',1],['PATO','🦆',1],['RANA','🐸',1],
  ['FLOR','🌸',2],['MANO','✋',2],['NUBE','☁️',2],['PERRO','🐶',2],['LIBRO','📚',2],
  ['COCHE','🚗',2],['ARBOL','🌳',2],['QUESO','🧀',2],['LECHE','🥛',2],['BARCO','⛵',3],
  ['PLATANO','🍌',3],['MANZANA','🍎',3],['ELEFANTE','🐘',3],['MARIPOSA','🦋',3]
];

let word = null;

function GamePalabras(){ track('juego-palabras'); Game.start(roundPalabras, 'Formar palabras'); }

function roundPalabras(){
  const lvl = Store.s.level6.palabras;
  const pool = WORDS.filter(w => w[2] <= lvl + 1);
  const [text, emoji] = pick(pool.length ? pool : WORDS);

  word = { text, built: [], used: [] };
  const letters = shuffle(text.split(''));

  UI.render(`<section>
    ${UI.scorebar('Ordena las letras', `✅ ${Store.s.correct}`)}
    <div class="card p-5 text-center">
      <div class="text-7xl bob">${emoji}</div>

      <div id="slots" class="flex flex-wrap justify-center gap-1.5 my-5"></div>

      <div id="tiles" class="flex flex-wrap justify-center gap-2">
        ${letters.map((l, i) => `<button class="btn3d b-violet w-14 h-14 text-2xl" data-i="${i}" data-l="${l}">${l}</button>`).join('')}
      </div>

      <div class="grid grid-cols-2 gap-2 mt-5">
        <button class="btn3d b-white py-4" onclick="wordBack()">⌫ Borrar</button>
        <button class="btn3d b-white py-4" onclick="Game.next()">⏭ Otra palabra</button>
      </div>
    </div></section>`);

  paintSlots();
  app.querySelectorAll('#tiles [data-i]').forEach(btn => {
    btn.onclick = () => {
      if(btn.disabled) return;
      btn.disabled = true; btn.style.opacity = .25;
      word.built.push(btn.dataset.l);
      word.used.push(btn);
      Audio_.tap();
      paintSlots();
      checkWord();
    };
  });
}

function paintSlots(){
  const box = document.getElementById('slots');
  if(!box || !word) return;
  box.innerHTML = word.text.split('').map((_, i) => {
    const l = word.built[i];
    return `<span class="inline-flex items-center justify-center w-12 h-14 rounded-xl border-[3px] text-2xl font-bold
      ${l ? 'bg-[#F1ECFF] border-[var(--violet)] text-[var(--violet-d)]' : 'bg-[#F6F9FD] border-dashed border-[#CBD8E8] text-transparent'}">${l || '·'}</span>`;
  }).join('');
}

function wordBack(){
  if(!word || !word.built.length) return;
  word.built.pop();
  const btn = word.used.pop();
  btn.disabled = false; btn.style.opacity = 1;
  Audio_.tap();
  paintSlots();
}

function checkWord(){
  if(word.built.length < word.text.length) return;
  const ok = word.built.join('') === word.text;
  Store.score(ok);

  if(ok){
    Audio_.good(); Audio_.coin(); FX.burst();
    palabrasHits++;
    if(palabrasHits % 8 === 0 && Store.s.level6.palabras < 3){
      Store.s.level6.palabras++;
      Store.addCoins(5);
      UI.levelUp(Store.s.level6.palabras, 'Llegan palabras más largas.');
      return;
    }
    setTimeout(continuar, 900);
  }else{
    Audio_.bad();
    const slots = document.getElementById('slots');
    slots.style.animation = 'shake .35s ease';
    setTimeout(() => {
      slots.style.animation = '';
      word.used.forEach(b => { b.disabled = false; b.style.opacity = 1; });
      word.built = []; word.used = [];
      paintSlots();
    }, 420);
  }
}
let palabrasHits = 0;

document.getElementById('btn-menu').onclick  = () => { Audio_.tap(); panelMenu(); };

/* --------------------- 10b. ESTADÍSTICAS DE USO ------------------------
   Agregadas y anónimas: cuántas visitas, qué juegos se abren y en qué tramo
   de minutos se queda la gente. Ningún dato del niño sale del teléfono.    */
function track(evento){
  try{
    if(window.goatcounter && window.goatcounter.count)
      window.goatcounter.count({ path: evento, title: evento, event: true });
  }catch(e){}
}

(function estadisticas(){
  if(!window.GC_CODE) return;                     // sin código, no se mide nada
  const s = document.createElement('script');
  s.async = true;
  s.src = '//gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter', `https://${window.GC_CODE}.goatcounter.com/count`);
  document.head.appendChild(s);

  const inicio = Date.now();
  window.addEventListener('pagehide', () => {
    const min = (Date.now() - inicio) / 60000;
    const tramo = min < 1 ? '0-1' : min < 5 ? '1-5' : min < 15 ? '5-15' : min < 30 ? '15-30' : '30+';
    track('sesion-' + tramo + '-min');
  }, { once:true });
})();

/* ------------------- 10c. INVITACIÓN A INSTALAR ------------------------
   Chrome y Edge avisan con 'beforeinstallprompt' y permiten lanzar el
   diálogo nativo. Safari en iPhone no lo tiene: ahí se explica a mano.    */
const PWA_KEY = 'aprende-jugando-instalar';
let promptInstalacion = null;

const yaInstalada = () => {
  try{
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
  }catch(e){}
  return window.navigator.standalone === true;    // Safari en iPhone
};

const esIOS = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function posponerInstalacion(dias){
  try{ localStorage.setItem(PWA_KEY, String(Date.now() + dias * 86400000)); }catch(e){}
}
function tocaPreguntar(){
  try{
    const hasta = Number(localStorage.getItem(PWA_KEY) || 0);
    return Date.now() > hasta;
  }catch(e){ return true; }
}
function ocultarInstalar(){ document.getElementById('install-bar').classList.add('hidden'); }

function mostrarInstalar(forzado){
  if(yaInstalada()) return;
  if(!forzado && !tocaPreguntar()) return;
  if(esIOS() && !promptInstalacion){
    document.getElementById('install-text').textContent =
      'Añádelo a la pantalla de inicio y se abrirá como una app.';
  }
  document.getElementById('install-bar').classList.remove('hidden');
}

/** Safari no deja instalar por código: hay que enseñar los pasos. */
function instruccionesIOS(){
  UI.openSheet(`
    <h2 class="text-2xl font-bold mb-3">Añadir a la pantalla de inicio</h2>
    <ol class="font-body space-y-3 text-[#20314A]">
      <li>1. Toca el botón <b>Compartir</b> ⬆️ de Safari, abajo en el centro.</li>
      <li>2. Baja en la lista y elige <b>Añadir a pantalla de inicio</b>.</li>
      <li>3. Pulsa <b>Añadir</b>. Te aparecerá el globo 🎈 junto al resto de apps.</li>
    </ol>
    <button class="btn3d b-mint w-full mt-5 py-4 text-lg" onclick="UI.closeSheet()">Entendido</button>`);
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();                       // se lanza cuando el usuario decida
  promptInstalacion = e;
  setTimeout(() => mostrarInstalar(false), 500);   // en cuanto el navegador avisa
});

window.addEventListener('appinstalled', () => {
  ocultarInstalar();
  promptInstalacion = null;
  posponerInstalacion(3650);
  FX.burst();
});

document.getElementById('install-no').onclick = () => {
  Audio_.tap();
  ocultarInstalar();
  posponerInstalacion(7);                   // no insistir en una semana
};

document.getElementById('install-yes').onclick = () => lanzarInstalacion();

// En iPhone no hay evento: se ofrece igualmente nada más abrir
if(esIOS() && !yaInstalada()) setTimeout(() => mostrarInstalar(false), 1200);

/* ------------------------------ 11. PWA -------------------------------- */
(function setupPWA(){
  // El manifest y los iconos son archivos reales del repositorio (manifest.webmanifest,
  // icon-192.png, icon-512.png): es lo que exige Chrome para ofrecer la instalación.
  // Aquí solo queda registrar el service worker, que da el funcionamiento sin conexión.
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

/* ------------------------------ 12. ARRANQUE ---------------------------
   El arranque va al final y protegido: un fallo del entorno (manifest, audio)
   nunca debe dejar la pantalla en blanco.                                   */
Store.load();
UI.paintCoins();
Home();
</script>
